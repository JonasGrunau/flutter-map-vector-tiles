# The checks every commit has to pass: format, analyze, the test suite on the
# VM and on Chrome, and a publish dry run. ci.yml calls this on every push to
# main and every PR into it; publish.yml calls it with pana on before a
# release.
name: Checks

on:
  workflow_call:
    inputs:
      pana:
        description: Also require full pub points from pana.
        type: boolean
        default: false
    outputs:
      flutter:
        description: The Flutter version the checks ran on.
        value: ${{ jobs.checks.outputs.flutter }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      flutter: ${{ steps.flutter.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Flutter version from .tool-versions
        id: flutter
        run: echo "version=$(awk '$1 == "flutter" { sub(/-stable$/, "", $2); print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - run: flutter pub get

      - name: dart format
        run: dart format --output=none --set-exit-if-changed .

      - run: flutter analyze

      - name: flutter test (VM)
        run: flutter test

      - name: flutter test (Chrome)
        run: flutter test --platform chrome

      - name: Publish dry run
        run: dart pub publish --dry-run

      - name: pana (full points)
        if: inputs.pana
        run: |
          dart pub global activate pana
          dart pub global run pana --exit-code-threshold 0 .
