# Publishes a release to pub.dev when its `vX.Y.Z` tag is pushed.
#
# `release` checks the tag against main, pubspec, README and CHANGELOG;
# `checks` runs checks.yml (the CI suite) with pana on. `publish` only
# uploads, once both pass. It is its own job so the OIDC token that can
# publish to pub.dev never shares a runner with the test suite or pana, and
# so the `pub.dev` environment's protection rules gate the upload alone.
#
# One-time setup on pub.dev (package admin → Automated publishing):
# repository `JonasGrunau/flutter-map-vector-tiles`, tag pattern `v{{version}}`,
# and "Require GitHub Actions environment" set to `pub.dev`.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # pub.dev tag pattern: v{{version}}

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the on-main check needs history
          persist-credentials: false

      - name: Tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Push main and the tag together: git push --atomic origin main $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Tag, pubspec, README and CHANGELOG agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          fail() { echo "::error::$1"; exit 1; }

          pubspec=$(sed -n 's/^version: *//p' pubspec.yaml)
          [ "$pubspec" = "$version" ] ||
            fail "Tag is $GITHUB_REF_NAME but pubspec.yaml says version: $pubspec"

          # The yaml block under "### 1. Install", compared line by line: a
          # substring match anywhere would let ^2.9.10 pass for v2.9.1.
          snippet=$(awk '/^### 1\. Install/ { f = 1 } f && /^```yaml/ { s = 1; next } s && /^```/ { exit } s' README.md)
          [ -n "$snippet" ] || fail "README has no yaml block under '### 1. Install'"

          grep -qxF "  flutter_map_vector_tiles: ^$version" <<< "$snippet" ||
            fail "README install snippet does not say flutter_map_vector_tiles: ^$version"

          flutter_map=$(sed -n 's/^  flutter_map: *//p' pubspec.yaml)
          [ -n "$flutter_map" ] && [ "$(wc -l <<< "$flutter_map")" -eq 1 ] ||
            fail "Could not read one flutter_map constraint from pubspec.yaml (got '$flutter_map')"
          grep -qxF "  flutter_map: $flutter_map" <<< "$snippet" ||
            fail "README install snippet does not say flutter_map: $flutter_map"

          heading=$(grep -m1 '^## ' CHANGELOG.md)
          [ "$heading" = "## $version" ] ||
            fail "Newest CHANGELOG section is '$heading', expected '## $version'"

          # The first non-empty line under the heading, indentation stripped.
          # A bullet (-, *) or another heading (#) there means the summary
          # line is missing, whatever follows the marker.
          summary=$(awk -v h="## $version" '$0 == h { f = 1; next } f && NF { sub(/^[ \t]+/, ""); print; exit }' CHANGELOG.md)
          case "$summary" in
            '' | -* | '*'* | '#'*) fail "CHANGELOG section $version has no summary line under its heading" ;;
          esac

  checks:
    uses: ./.github/workflows/checks.yml
    with:
      pana: true

  publish:
    needs: [release, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # OIDC token for pub.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No SDK cache here: this job holds the publishing token.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ needs.checks.outputs.flutter }}

      - run: flutter pub get

      # Last before publishing: setup-dart mints the pub.dev OIDC token when
      # it runs, and GitHub's OIDC tokens are short-lived (its example token
      # expires five minutes after it is issued). Run before the uncached
      # Flutter download and `pub get` above, the token could expire before
      # the upload.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      # `flutter pub publish`, not `dart pub publish`: setup-dart just put its
      # plain Dart SDK first on PATH, and that `dart` cannot resolve the
      # package's Flutter SDK dependency. Flutter's pub reads the token
      # setup-dart registered (`dart pub token add … --env-var PUB_TOKEN`).
      - run: flutter pub publish --force
